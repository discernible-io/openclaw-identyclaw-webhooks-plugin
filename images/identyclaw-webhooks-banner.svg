<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">IdentyClaw Webhooks Gateway Component</title>
  <desc id="banner-desc">Banner for the IdentyClaw OpenClaw webhooks plugin with RODiT Ed25519 ingress aligned to IdentyClaw MCP docs.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="banner-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="banner-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#banner-bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#banner-accent)"/>

  <!-- Webhook icon -->
  <g transform="translate(96 96)" filter="url(#banner-glow)">
    <circle cx="64" cy="64" r="56" fill="#064e3b" stroke="url(#banner-accent)" stroke-width="3"/>
    <path d="M32 64 C32 44 48 28 68 28 C88 28 104 44 104 64" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round"/>
    <path d="M96 64 C96 84 80 100 60 100 C40 100 24 84 24 64" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="10" fill="#14b8a6"/>
    <path d="M64 54 L64 38 M54 64 L38 64 M74 64 L90 64 M64 74 L64 90" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="240" y="132" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700">IdentyClaw Webhooks Gateway Component</text>
  <text x="240" y="178" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">RODiT Ed25519 webhook ingress for OpenClaw</text>
  <text x="240" y="214" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Signed /hooks/wake ù /hooks/agent ù send_rodit_webhook ù IdentyClaw MCP contract</text>

  <rect x="240" y="244" width="720" height="2" fill="#334155" opacity="0.6"/>
  <text x="240" y="276" fill="#5eead4" font-family="ui-monospace, monospace" font-size="14">x-signature + x-timestamp ù @rodit/rodit-auth-be ù Passport webhook_url metadata</text>
</svg>
